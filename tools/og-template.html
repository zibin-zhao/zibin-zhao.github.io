<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{background:#e7e7e8;font-family:'Helvetica Neue',Arial,sans-serif;display:flex;padding:34px}
  .card{flex:1;background:#fff;border-radius:36px;box-shadow:0 30px 70px rgba(0,0,0,.14);position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
  .pill{position:absolute;top:30px;left:34px;border:1px solid #e4e4e7;border-radius:24px;padding:10px 18px;font-size:16px;display:flex;align-items:center;gap:9px;color:#18181b}
  .dot{width:10px;height:10px;border-radius:50%;background:#22c55e}
  .name{font-size:150px;font-weight:800;letter-spacing:-6px;line-height:.9;color:#18181b}
  .name .o{color:transparent;-webkit-text-stroke:3px #18181b}
  .sub{margin-top:22px;font-size:26px;color:#52525b;letter-spacing:.5px}
</style></head><body>
  <div class="card">
    <div class="pill"><span class="dot"></span> Open to Collaboration</div>
    <div class="name"><span class="o">ZIBIN</span> ZHAO</div>
    <div class="sub">Bioengineering × AI · PhD researcher @ HKUST</div>
  </div>
</body></html>
